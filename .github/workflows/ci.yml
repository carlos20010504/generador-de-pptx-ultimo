name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

# Don't pile up redundant builds — newer commit on the same branch wins.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: TypeScript + Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS deps
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Next.js production build
        # Skip telemetry and use the same build that ships.
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx next build

  python-tests:
    name: Pipeline Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist

      - name: Run pytest
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python -m pytest __tests__/python/ -q --tb=short

  stress-tests:
    name: Pipeline stress fixtures (parser → render)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build stress fixtures (12 Excels covering edge cases)
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scripts/build_stress_fixtures.py

      - name: Smoke (parser → inventory → onboarding) — exits non-zero on any FAIL
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scripts/stress_test_smoke.py

      - name: Render (extractor → renderer) — generates 12 PPTX, validates structure
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python scripts/stress_test_render.py

      - name: Upload reports + sample decks (always, for inspection on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-reports
          path: |
            __tests__/stress_fixtures/_smoke_report.json
            __tests__/stress_fixtures/_render_report.json
            __tests__/stress_fixtures/decks/
          retention-days: 7
          if-no-files-found: warn

  e2e-playwright:
    name: E2E smoke (Playwright + production build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS deps
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium (only browser we test)
        run: npx playwright install chromium --with-deps

      - name: Next.js production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx next build

      - name: Run Playwright (webServer auto-starts npm run start)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
